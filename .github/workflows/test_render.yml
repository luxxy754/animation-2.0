name: Toon Render Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contact-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install render dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless Pillow

      - name: Render 10 test frames
        run: python dev_test.py

      - name: Upload contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toon-contact-sheet
          path: contact_sheet.png
          if-no-files-found: warn
          retention-days: 7
